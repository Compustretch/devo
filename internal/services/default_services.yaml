loki:
  description: Loki log aggregation
  env:
    LOKI_URL: http://127.0.0.1:3100
  params:
    version: "3.4.2"
  compose:
    image: "grafana/loki:{{version}}"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]
  datasource:
    name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
  smoke:
    rust:
      tests/loki_smoke.rs: |
        //! Smoke test: push a log entry to Loki.
        //!
        //! Needs the local stack running (`devo dev`).
        //! Run with: cargo test --test loki_smoke -- --nocapture
        //!
        //! Generated by devo when the loki service was enabled. Edit freely; devo
        //! won't overwrite it, and removes it if the service is removed.

        use std::io::{Read, Write};
        use std::net::TcpStream;
        use std::thread;
        use std::time::{Duration, SystemTime, UNIX_EPOCH};

        const ADDR: &str = "localhost:3100";

        /// Minimal HTTP/1.0 client (std only), so this test needs no dependencies.
        fn http(
            addr: &str,
            method: &str,
            path: &str,
            content_type: &str,
            body: &str,
        ) -> Result<(u16, String), String> {
            let mut stream =
                TcpStream::connect(addr).map_err(|e| format!("could not connect to {addr}: {e}"))?;
            stream
                .set_read_timeout(Some(Duration::from_secs(10)))
                .map_err(|e| e.to_string())?;
            let request = format!(
                "{method} {path} HTTP/1.0\r\nHost: {addr}\r\nContent-Type: {content_type}\r\nContent-Length: {}\r\n\r\n{body}",
                body.len()
            );
            stream
                .write_all(request.as_bytes())
                .map_err(|e| e.to_string())?;
            let mut response = String::new();
            stream
                .read_to_string(&mut response)
                .map_err(|e| e.to_string())?;
            let status = response
                .split_whitespace()
                .nth(1)
                .and_then(|code| code.parse().ok())
                .unwrap_or(0);
            let body = response
                .split_once("\r\n\r\n")
                .map(|(_, b)| b.to_string())
                .unwrap_or_default();
            Ok((status, body))
        }

        /// Services take a few seconds to come up; retry for up to a minute.
        fn wait_until(what: &str, mut check: impl FnMut() -> Result<(), String>) {
            let mut last = String::new();
            for _ in 0..30 {
                match check() {
                    Ok(()) => return,
                    Err(e) => last = e,
                }
                thread::sleep(Duration::from_secs(2));
            }
            panic!("{what} not ready after 60s: {last}\nIs the stack up? Try `devo dev`.");
        }

        #[test]
        fn writes_a_log_entry_to_loki() {
            wait_until("Loki", || match http(ADDR, "GET", "/ready", "text/plain", "") {
                Ok((200, body)) if body.trim() == "ready" => Ok(()),
                Ok((status, body)) => Err(format!("HTTP {status}: {}", body.trim())),
                Err(e) => Err(e),
            });

            let nanos = SystemTime::now().duration_since(UNIX_EPOCH).unwrap().as_nanos().to_string();
            let body = r#"{"streams":[{"stream":{"app":"devo-smoke"},"values":[["__NS__","hello world __NS__"]]}]}"#
                .replace("__NS__", &nanos);

            let (status, resp) = http(ADDR, "POST", "/loki/api/v1/push", "application/json", &body)
                .unwrap_or_else(|e| panic!("push to Loki failed: {e}"));
            assert_eq!(status, 204, "Loki rejected the log entry: HTTP {status}: {resp}");
            println!("ok: pushed a log entry to Loki (app=devo-smoke)");
        }

tempo:
  description: Tempo distributed tracing (OTLP on 4317 gRPC / 4318 HTTP)
  env:
    TEMPO_URL: http://127.0.0.1:3200
    TEMPO_OTLP_GRPC_ENDPOINT: http://127.0.0.1:4317
    TEMPO_OTLP_HTTP_ENDPOINT: http://127.0.0.1:4318
  params:
    version: "2.7.2"
  compose:
    image: "grafana/tempo:{{version}}"
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: root
    ports: ["3200:3200", "4317:4317", "4318:4318"]
    volumes:
      - ./platform/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
  datasource:
    name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
  files:
    platform/tempo/tempo.yaml: |
      server:
        http_listen_port: 3200
      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
      storage:
        trace:
          backend: local
          wal:
            path: /var/tempo/wal
          local:
            path: /var/tempo/blocks
  smoke:
    rust:
      tests/tempo_smoke.rs: |
        //! Smoke test: send a trace to Tempo over OTLP/HTTP.
        //!
        //! Needs the local stack running (`devo dev`).
        //! Run with: cargo test --test tempo_smoke -- --nocapture
        //!
        //! Generated by devo when the tempo service was enabled. Edit freely; devo
        //! won't overwrite it, and removes it if the service is removed.

        use std::io::{Read, Write};
        use std::net::TcpStream;
        use std::thread;
        use std::time::{Duration, SystemTime, UNIX_EPOCH};

        const READY_ADDR: &str = "localhost:3200";
        const OTLP_ADDR: &str = "localhost:4318";

        /// Minimal HTTP/1.0 client (std only), so this test needs no dependencies.
        fn http(
            addr: &str,
            method: &str,
            path: &str,
            content_type: &str,
            body: &str,
        ) -> Result<(u16, String), String> {
            let mut stream =
                TcpStream::connect(addr).map_err(|e| format!("could not connect to {addr}: {e}"))?;
            stream
                .set_read_timeout(Some(Duration::from_secs(10)))
                .map_err(|e| e.to_string())?;
            let request = format!(
                "{method} {path} HTTP/1.0\r\nHost: {addr}\r\nContent-Type: {content_type}\r\nContent-Length: {}\r\n\r\n{body}",
                body.len()
            );
            stream
                .write_all(request.as_bytes())
                .map_err(|e| e.to_string())?;
            let mut response = String::new();
            stream
                .read_to_string(&mut response)
                .map_err(|e| e.to_string())?;
            let status = response
                .split_whitespace()
                .nth(1)
                .and_then(|code| code.parse().ok())
                .unwrap_or(0);
            let body = response
                .split_once("\r\n\r\n")
                .map(|(_, b)| b.to_string())
                .unwrap_or_default();
            Ok((status, body))
        }

        /// Services take a few seconds to come up; retry for up to a minute.
        fn wait_until(what: &str, mut check: impl FnMut() -> Result<(), String>) {
            let mut last = String::new();
            for _ in 0..30 {
                match check() {
                    Ok(()) => return,
                    Err(e) => last = e,
                }
                thread::sleep(Duration::from_secs(2));
            }
            panic!("{what} not ready after 60s: {last}\nIs the stack up? Try `devo dev`.");
        }

        #[test]
        fn sends_a_trace_to_tempo() {
            wait_until("Tempo", || match http(READY_ADDR, "GET", "/ready", "text/plain", "") {
                Ok((200, body)) if body.trim() == "ready" => Ok(()),
                Ok((status, body)) => Err(format!("HTTP {status}: {}", body.trim())),
                Err(e) => Err(e),
            });

            let end = SystemTime::now().duration_since(UNIX_EPOCH).unwrap().as_nanos();
            let start = end - 1_000_000; // a 1ms span
            let body = r#"{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"devo-smoke"}}]},"scopeSpans":[{"scope":{"name":"devo-smoke"},"spans":[{"traceId":"__TRACE__","spanId":"__SPAN__","name":"hello-world","kind":1,"startTimeUnixNano":"__START__","endTimeUnixNano":"__END__"}]}]}]}"#
                .replace("__TRACE__", &format!("{end:032x}"))
                .replace("__SPAN__", &format!("{:016x}", end as u64))
                .replace("__START__", &start.to_string())
                .replace("__END__", &end.to_string());

            let (status, resp) = http(OTLP_ADDR, "POST", "/v1/traces", "application/json", &body)
                .unwrap_or_else(|e| panic!("sending trace to Tempo failed: {e}"));
            assert_eq!(status, 200, "Tempo rejected the trace: HTTP {status}: {resp}");
            println!("ok: sent a trace to Tempo (service.name=devo-smoke)");
        }

rabbitmq:
  description: RabbitMQ message broker (management UI on 15672)
  env:
    RABBITMQ_URL: amqp://127.0.0.1:5672
    RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
  auth:
    RABBITMQ_USER: "{{user}}"
    RABBITMQ_PASSWORD: "{{password}}"
  params:
    version: "4"
    user: app
    password: app
  compose:
    image: "rabbitmq:{{version}}-management"
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: "{{user}}"
      RABBITMQ_DEFAULT_PASS: "{{password}}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
  volumes: [rabbitmq_data]
  smoke:
    rust:
      tests/rabbitmq_smoke.rs: |
        //! Smoke test: connect to RabbitMQ and complete the AMQP handshake.
        //!
        //! This proves the broker is up and speaking AMQP 0-9-1. Publishing a message
        //! needs a client library; add one (e.g. `lapin`) for a full round trip.
        //!
        //! Needs the local stack running (`devo dev`).
        //! Run with: cargo test --test rabbitmq_smoke -- --nocapture
        //!
        //! Generated by devo when the rabbitmq service was enabled. Edit freely; devo
        //! won't overwrite it, and removes it if the service is removed.

        use std::io::{Read, Write};
        use std::net::TcpStream;
        use std::thread;
        use std::time::Duration;

        const ADDR: &str = "localhost:5672";

        /// Connects, retrying for up to a minute while the service starts.
        fn connect() -> TcpStream {
            for _ in 0..30 {
                if let Ok(stream) = TcpStream::connect(ADDR) {
                    stream
                        .set_read_timeout(Some(Duration::from_secs(10)))
                        .unwrap();
                    return stream;
                }
                thread::sleep(Duration::from_secs(2));
            }
            panic!("could not connect to {ADDR} after 60s.\nIs the stack up? Try `devo dev`.");
        }

        #[test]
        fn rabbitmq_speaks_amqp() {
            let mut stream = connect();

            // AMQP 0-9-1 protocol header.
            stream.write_all(b"AMQP\x00\x00\x09\x01").unwrap();

            // The broker replies with a Connection.Start method frame (frame type 1).
            let mut first = [0u8; 1];
            stream.read_exact(&mut first).expect("no reply from RabbitMQ");
            assert_eq!(
                first[0], 1,
                "expected an AMQP method frame (type 1), got byte {}",
                first[0]
            );
            println!("ok: RabbitMQ at {ADDR} answered the AMQP handshake");
        }

ollaya:
  description: Ollaya decision-model server, TypeSafe/Jev-compatible API on 11435 (CPU image)
  params:
    version: latest
    keep_alive: 5m
  compose:
    image: "ghcr.io/ollaya-dev/ollaya:{{version}}"
    # Bound to loopback: Ollaya listens on 0.0.0.0 inside the container, and
    # without OLLAYA_API_KEY anyone who can reach the port can use it.
    ports: ["127.0.0.1:11435:11435"]
    environment:
      OLLAYA_KEEP_ALIVE: "{{keep_alive}}"
    volumes:
      - ollaya_data:/home/ollaya/.ollaya
    # The image's own check: GET / must answer "Ollaya is running".
    healthcheck:
      test: ["CMD", "/usr/local/bin/ollaya-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
  volumes: [ollaya_data]
  smoke:
    rust:
      tests/ollaya_smoke.rs: |
        //! Smoke test: check that the Ollaya server is up and reports its version.
        //!
        //! This does not pull a model or run a decision. Pull one first
        //! (`docker compose exec ollaya ollaya pull laya`) and POST to /v1/systemone
        //! for a full round trip.
        //!
        //! Needs the local stack running (`devo dev`).
        //! Run with: cargo test --test ollaya_smoke -- --nocapture
        //!
        //! Generated by devo when the ollaya service was enabled. Edit freely; devo
        //! won't overwrite it, and removes it if the service is removed.

        use std::io::{Read, Write};
        use std::net::TcpStream;
        use std::thread;
        use std::time::Duration;

        const ADDR: &str = "localhost:11435";

        /// Minimal HTTP/1.0 client (std only), so this test needs no dependencies.
        fn http(addr: &str, method: &str, path: &str) -> Result<(u16, String), String> {
            let mut stream =
                TcpStream::connect(addr).map_err(|e| format!("could not connect to {addr}: {e}"))?;
            stream
                .set_read_timeout(Some(Duration::from_secs(10)))
                .map_err(|e| e.to_string())?;
            let request = format!("{method} {path} HTTP/1.0\r\nHost: {addr}\r\n\r\n");
            stream
                .write_all(request.as_bytes())
                .map_err(|e| e.to_string())?;
            let mut response = String::new();
            stream
                .read_to_string(&mut response)
                .map_err(|e| e.to_string())?;
            let status = response
                .split_whitespace()
                .nth(1)
                .and_then(|code| code.parse().ok())
                .unwrap_or(0);
            let body = response
                .split_once("\r\n\r\n")
                .map(|(_, b)| b.to_string())
                .unwrap_or_default();
            Ok((status, body))
        }

        /// Services take a few seconds to come up; retry for up to a minute.
        fn wait_until(what: &str, mut check: impl FnMut() -> Result<(), String>) {
            let mut last = String::new();
            for _ in 0..30 {
                match check() {
                    Ok(()) => return,
                    Err(e) => last = e,
                }
                thread::sleep(Duration::from_secs(2));
            }
            panic!("{what} not ready after 60s: {last}\nIs the stack up? Try `devo dev`.");
        }

        #[test]
        fn ollaya_is_running() {
            wait_until("Ollaya", || match http(ADDR, "GET", "/") {
                Ok((200, body)) if body.contains("Ollaya is running") => Ok(()),
                Ok((status, body)) => Err(format!("HTTP {status}: {}", body.trim())),
                Err(e) => Err(e),
            });

            let (status, body) = http(ADDR, "GET", "/api/version")
                .unwrap_or_else(|e| panic!("request to Ollaya failed: {e}"));
            assert_eq!(status, 200, "Ollaya returned HTTP {status} for /api/version: {body}");
            println!("ok: Ollaya at {ADDR} reports {}", body.trim());
        }
