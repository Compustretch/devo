      golang.org/x/tools v0.42.0/go.mod h1:Ma6lCIwGZvHK6XtgbswSoWroEkhugApmsXyrUmBhfr0=
    platform/toolserver/main.go: |
      package main
      
      import (
      	"context"
      	"encoding/json"
      	"errors"
      	"fmt"
      	"log"
      	"net"
      	"net/http"
      	"os"
      	"os/exec"
      	"os/signal"
      	"strings"
      	"syscall"
      	"time"
      
      	"github.com/modelcontextprotocol/go-sdk/mcp"
      	_ "time/tzdata"
      )
      
      const (
      	serverName         = "devo-toolserver"
      	serverVersion      = "0.1.0"
      	defaultListen      = "0.0.0.0:8000"
      	defaultGrafanaBin  = "/app/mcp-grafana"
      	grafanaPrefix      = "grafana."
      	grafanaTools       = "search,datasource,incident,prometheus,loki,alerting,dashboard,folder,oncall,asserts,pyroscope,navigation,annotations,rendering,snapshot,plugin,api,config,provisioning,docs,user,sql"
      )
      
      type DayInput struct {
      	Timezone string `json:"timezone" jsonschema:"IANA timezone of the calling client, for example America/New_York"`
      }
      
      type DaySummary struct {
      	Date    string `json:"date"`
      	Weekday string `json:"weekday"`
      }
      
      type DayOutput struct {
      	Date      string `json:"date"`
      	Weekday   string `json:"weekday"`
      	Timezone  string `json:"timezone"`
      	Tomorrow  DaySummary `json:"tomorrow"`
      	Yesterday DaySummary `json:"yesterday"`
      	Text      string `json:"text"`
      }
      
      // dayAt interprets now in the caller's timezone, then performs date arithmetic
      // on date-only values. This avoids assuming the container's timezone and avoids
      // 24-hour duration arithmetic across daylight-saving transitions.
      func dayAt(now time.Time, timezone string) (DayOutput, error) {
      	timezone = strings.TrimSpace(timezone)
      	if timezone == "" {
      		return DayOutput{}, errors.New("timezone is required; provide the caller's IANA timezone")
      	}
      	if timezone == "Local" {
      		return DayOutput{}, errors.New("timezone must be an IANA timezone, not Local")
      	}
      	location, err := time.LoadLocation(timezone)
      	if err != nil {
      		return DayOutput{}, fmt.Errorf("invalid IANA timezone %q: %w", timezone, err)
      	}
      
      	localNow := now.In(location)
      	// A UTC date anchor preserves Gregorian calendar arithmetic independently
      	// of offset changes in the caller's timezone.
      	today := time.Date(localNow.Year(), localNow.Month(), localNow.Day(), 12, 0, 0, 0, time.UTC)
      	summary := func(date time.Time) DaySummary {
      		return DaySummary{Date: date.Format("2006-01-02"), Weekday: date.Weekday().String()}
      	}
      
      	todaySummary := summary(today)
      	return DayOutput{
      		Date:      todaySummary.Date,
      		Weekday:   todaySummary.Weekday,
      		Timezone:  timezone,
      		Tomorrow:  summary(today.AddDate(0, 0, 1)),
      		Yesterday: summary(today.AddDate(0, 0, -1)),
      		Text:      "Today is " + todaySummary.Weekday,
      	}, nil
      }
      
      type toolCatalog struct {
      	owners map[string]string
      }
      
      func newToolCatalog() *toolCatalog {
      	return &toolCatalog{owners: make(map[string]string)}
      }
      
      func (c *toolCatalog) reserve(name, owner string) error {
      	if previous, exists := c.owners[name]; exists {
      		return fmt.Errorf("MCP tool name %q is registered by both %s and %s", name, previous, owner)
      	}
      	c.owners[name] = owner
      	return nil
      }
      
      func registerDayTool(server *mcp.Server, catalog *toolCatalog) error {
      	if err := catalog.reserve("day.get", "native tools"); err != nil {
      		return err
      	}
      	mcp.AddTool(server, &mcp.Tool{
      		Name:        "day.get",
      		Description: "Get today's date and weekday, plus yesterday and tomorrow, in the calling client's IANA timezone. The timezone argument is required; the tool never assumes the container's timezone.",
      	}, func(_ context.Context, _ *mcp.CallToolRequest, input DayInput) (*mcp.CallToolResult, DayOutput, error) {
      		output, err := dayAt(time.Now(), input.Timezone)
      		return nil, output, err
      	})
      	return nil
      }
      
      func validateInputSchema(schema any) error {
      	if schema == nil {
      		return errors.New("provider tool has no input schema")
      	}
      	data, err := json.Marshal(schema)
      	if err != nil {
      		return fmt.Errorf("marshal provider input schema: %w", err)
      	}
      	var value struct {
      		Type string `json:"type"`
      	}
      	if err := json.Unmarshal(data, &value); err != nil {
      		return fmt.Errorf("decode provider input schema: %w", err)
      	}
      	if value.Type != "object" {
      		return fmt.Errorf("provider input schema root type is %q, want object", value.Type)
      	}
      	return nil
      }
      
      // registerProviderTools publishes an upstream MCP server's tools through the
      // shared catalog. Prefixes preserve ownership and prevent provider name clashes.
      func registerProviderTools(
      	ctx context.Context,
      	server *mcp.Server,
      	catalog *toolCatalog,
      	providerName string,
      	prefix string,
      	session *mcp.ClientSession,
      ) (int, error) {
      	var tools []*mcp.Tool
      	for tool, err := range session.Tools(ctx, nil) {
      		if err != nil {
      			return 0, fmt.Errorf("list tools from %s provider: %w", providerName, err)
      		}
      		if tool != nil {
      			tools = append(tools, tool)
      		}
      	}
      
      	for _, tool := range tools {
      		qualifiedName := prefix + tool.Name
      		if err := validateInputSchema(tool.InputSchema); err != nil {
      			return 0, fmt.Errorf("%s tool %q: %w", providerName, tool.Name, err)
      		}
      		if err := catalog.reserve(qualifiedName, providerName); err != nil {
      			return 0, err
      		}
      	}
      
      	for _, upstreamTool := range tools {
      		originalName := upstreamTool.Name
      		qualifiedTool := *upstreamTool
      		qualifiedTool.Name = prefix + originalName
      
      		server.AddTool(&qualifiedTool, func(callCtx context.Context, request *mcp.CallToolRequest) (*mcp.CallToolResult, error) {
      			result, err := session.CallTool(callCtx, &mcp.CallToolParams{
      				Name:      originalName,
      				Arguments: request.Params.Arguments,
      			})
      			if err != nil {
      				return &mcp.CallToolResult{
      					Content: []mcp.Content{&mcp.TextContent{
      						Text: fmt.Sprintf("%s provider tool %s failed: %v", providerName, originalName, err),
      					}},
      					IsError: true,
      				}, nil
      			}
      			return result, nil
      		})
      	}
      	return len(tools), nil
      }
      
      func connectGrafana(ctx context.Context) (*mcp.ClientSession, error) {
      	binary := os.Getenv("GRAFANA_MCP_BIN")
      	if binary == "" {
      		binary = defaultGrafanaBin
      	}
      	command := exec.Command(binary,
      		"--transport", "stdio",
      		"--enabled-tools", grafanaTools,
      		"--disable-write",
      	)
      	command.Stderr = os.Stderr
      	client := mcp.NewClient(&mcp.Implementation{
      		Name: serverName + "-grafana-upstream", Version: serverVersion,
      	}, nil)
      	session, err := client.Connect(ctx, &mcp.CommandTransport{Command: command}, nil)
      	if err != nil {
      		return nil, fmt.Errorf("connect to bundled Grafana MCP provider: %w", err)
      	}
      	return session, nil
      }
      
      
      func allowlisted(value, configured, defaults string) bool {
      	// Configuration adds explicit names without removing the safe loopback
      	// defaults required by the container's own health check.
      	configured = strings.Trim(strings.Join([]string{defaults, configured}, ","), ",")
      	for _, candidate := range strings.Split(configured, ",") {
      		if strings.EqualFold(strings.TrimSpace(candidate), strings.TrimSpace(value)) {
      			return true
      		}
      	}
      	return false
      }
      
      func allowedHost(host string) bool {
      	const loopbackHosts = "localhost,localhost:8000,127.0.0.1,127.0.0.1:8000,[::1],[::1]:8000"
      	return allowlisted(host, os.Getenv("TOOLSERVER_ALLOWED_HOSTS"), loopbackHosts)
      }
      
      func allowedOrigin(origin string) bool {
      	return origin == "" || allowlisted(origin, os.Getenv("TOOLSERVER_ALLOWED_ORIGINS"), "")
      }
      
      // addVaryToken appends a token to Vary without discarding existing values.
      func addVaryToken(header http.Header, token string) {
      	for _, value := range header.Values("Vary") {
      		for _, existing := range strings.Split(value, ",") {
      			if strings.EqualFold(strings.TrimSpace(existing), token) {
      				return
      			}
      		}
      	}
      	header.Add("Vary", token)
      }
      
      func allowedCORSMethod(method string) bool {
      	switch method {
      	case http.MethodGet, http.MethodPost, http.MethodDelete:
      		return true
      	default:
      		return false
      	}
      }
      
      func allowedCORSHeader(header string) bool {
      	switch strings.ToLower(strings.TrimSpace(header)) {
      	case "accept", "authorization", "content-type", "last-event-id",
      		"mcp-protocol-version", "mcp-session-id":
      		return true
      	default:
      		return false
      	}
      }
      
      // requestSecurity validates Host and Origin before serving requests. For an
      // allowlisted browser Origin it also implements the MCP Streamable HTTP CORS
      // contract. CORS never relaxes either allowlist.
      func requestSecurity(next http.Handler) http.Handler {
      	return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      		if !allowedHost(r.Host) {
      			http.Error(w, "forbidden: host not allowed", http.StatusForbidden)
      			return
      		}
      
      		origin := r.Header.Get("Origin")
      		if !allowedOrigin(origin) {
      			http.Error(w, "forbidden: origin not allowed", http.StatusForbidden)
      			return
      		}
      
      	if origin != "" {
      			w.Header().Set("Access-Control-Allow-Origin", origin)
      			w.Header().Set("Access-Control-Expose-Headers", "Mcp-Session-Id, Mcp-Protocol-Version")
      			addVaryToken(w.Header(), "Origin")
      		}
      
      	if r.Method == http.MethodOptions && r.Header.Get("Access-Control-Request-Method") != "" {
      		requestedMethod := r.Header.Get("Access-Control-Request-Method")
      		if !allowedCORSMethod(requestedMethod) {
      			http.Error(w, "forbidden: method not allowed by CORS policy", http.StatusForbidden)
      			return
      		}
      
      		requestedHeaders := strings.Split(r.Header.Get("Access-Control-Request-Headers"), ",")
      		for _, header := range requestedHeaders {
      			if strings.TrimSpace(header) != "" && !allowedCORSHeader(header) {
      				http.Error(w, "forbidden: header not allowed by CORS policy", http.StatusForbidden)
      				return
      			}
      		}
      
      		w.Header().Set("Access-Control-Allow-Methods", "GET, POST, DELETE")
      		w.Header().Set("Access-Control-Allow-Headers", "Accept, Authorization, Content-Type, Last-Event-ID, Mcp-Protocol-Version, Mcp-Session-Id")
      		addVaryToken(w.Header(), "Access-Control-Request-Method")
      		addVaryToken(w.Header(), "Access-Control-Request-Headers")
      		w.Header().Set("Access-Control-Max-Age", "600")
      		w.WriteHeader(http.StatusNoContent)
      		return
      	}
      
      		next.ServeHTTP(w, r)
      	})
      }
      
      func run(ctx context.Context) error {
      	mcpServer := mcp.NewServer(
      		&mcp.Implementation{Name: serverName, Version: serverVersion},
      		&mcp.ServerOptions{Instructions: "Native tools are registered directly. Tools prefixed with grafana. are forwarded to the bundled Grafana MCP provider."},
      	)
      	catalog := newToolCatalog()
      	if err := registerDayTool(mcpServer, catalog); err != nil {
      		return err
      	}
      
      	grafanaSession, err := connectGrafana(ctx)
      	if err != nil {
      		// Native tools remain available if an optional upstream cannot start.
      		log.Printf("warning: Grafana MCP provider unavailable: %v", err)
      	} else {
      		count, registerErr := registerProviderTools(ctx, mcpServer, catalog, "Grafana", grafanaPrefix, grafanaSession)
      		if registerErr != nil {
      			_ = grafanaSession.Close()
      			log.Printf("warning: Grafana MCP tools were not registered: %v", registerErr)
      		} else {
      			defer func() {
      				if closeErr := grafanaSession.Close(); closeErr != nil {
      					log.Printf("close Grafana MCP provider: %v", closeErr)
      				}
      			}()
      			log.Printf("registered %d Grafana MCP tools", count)
      		}
      	}
      
      	address := os.Getenv("TOOLSERVER_ADDR")
      	if address == "" {
      		address = defaultListen
      	}
      	if _, _, err := net.SplitHostPort(address); err != nil {
      		return fmt.Errorf("invalid TOOLSERVER_ADDR %q: %w", address, err)
      	}
      
      	mcpHandler := mcp.NewStreamableHTTPHandler(
      		func(*http.Request) *mcp.Server { return mcpServer },
      		&mcp.StreamableHTTPOptions{Stateless: true, JSONResponse: true},
      	)
      	mux := http.NewServeMux()
      	mux.Handle("/mcp", mcpHandler)
      	mux.HandleFunc("/healthz", func(w http.ResponseWriter, r *http.Request) {
      		if r.Method != http.MethodGet {
      			w.Header().Set("Allow", http.MethodGet)
      			http.Error(w, "method not allowed", http.StatusMethodNotAllowed)
      			return
      		}
      		w.Header().Set("Content-Type", "text/plain; charset=utf-8")
      		w.WriteHeader(http.StatusOK)
      		_, _ = w.Write([]byte("ok\n"))
      	})
      
      	httpServer := &http.Server{
      		Addr: address, Handler: requestSecurity(mux),
      		ReadHeaderTimeout: 5 * time.Second,
      		IdleTimeout: 60 * time.Second,
      	}
      	serverErrors := make(chan error, 1)
      	go func() {
      		log.Printf("MCP toolserver listening on %s", address)
      		serverErrors <- httpServer.ListenAndServe()
      	}()
      
      	select {
      	case <-ctx.Done():
      		shutdownCtx, cancel := context.WithTimeout(context.Background(), 10*time.Second)
      		defer cancel()
      		if err := httpServer.Shutdown(shutdownCtx); err != nil {
      			_ = httpServer.Close()
      			return fmt.Errorf("shut down MCP HTTP server: %w", err)
      		}
      		return nil
      	case err := <-serverErrors:
      		if errors.Is(err, http.ErrServerClosed) {
      			return nil
      		}
      		return fmt.Errorf("serve MCP HTTP endpoint: %w", err)
      	}
      }
      
      func healthcheck() error {
      	url := os.Getenv("TOOLSERVER_HEALTH_URL")
      	if url == "" {
      		url = "http://127.0.0.1:8000/healthz"
      	}
      	client := &http.Client{Timeout: 2 * time.Second}
      	response, err := client.Get(url)
      	if err != nil {
      		return err
      	}
      	defer response.Body.Close()
      	if response.StatusCode != http.StatusOK {
      		return fmt.Errorf("health endpoint returned HTTP %d", response.StatusCode)
      	}
      	return nil
      }
      
      func main() {
      	if len(os.Args) == 2 && os.Args[1] == "healthcheck" {
      		if err := healthcheck(); err != nil {
      			log.Printf("toolserver healthcheck failed: %v", err)
      			os.Exit(1)
      		}
      		return
      	}
      	if len(os.Args) != 1 {
      		log.Printf("usage: devo-toolserver [healthcheck]")
      		os.Exit(2)
      	}
      
      	ctx, stop := signal.NotifyContext(context.Background(), syscall.SIGINT, syscall.SIGTERM)
      	defer stop()
      	if err := run(ctx); err != nil {
      		log.Printf("toolserver failed: %v", err)
      		os.Exit(1)
      	}
      }
    platform/toolserver/main_test.go: |
      package main
      
      import (
      	"net/http"
      	"net/http/httptest"
      	"testing"
      	"time"
      )
      
      func TestDayAtUsesCallerTimezone(t *testing.T) {
      	now := time.Date(2026, time.November, 18, 2, 30, 0, 0, time.UTC)
      	got, err := dayAt(now, "America/New_York")
      	if err != nil {
      		t.Fatal(err)
      	}
      	if got.Date != "2026-11-17" || got.Weekday != "Tuesday" {
      		t.Fatalf("today = %s %s, want 2026-11-17 Tuesday", got.Date, got.Weekday)
      	}
      	if got.Timezone != "America/New_York" {
      		t.Fatalf("timezone = %q", got.Timezone)
      	}
      	if got.Tomorrow.Date != "2026-11-18" || got.Tomorrow.Weekday != "Wednesday" {
      		t.Fatalf("tomorrow = %+v", got.Tomorrow)
      	}
      	if got.Yesterday.Date != "2026-11-16" || got.Yesterday.Weekday != "Monday" {
      		t.Fatalf("yesterday = %+v", got.Yesterday)
      	}
      	if got.Text != "Today is Tuesday" {
      		t.Fatalf("text = %q", got.Text)
      	}
      }
      
      func TestDayAtCalendarArithmeticAcrossDST(t *testing.T) {
      	now := time.Date(2026, time.March, 8, 5, 30, 0, 0, time.UTC)
      	got, err := dayAt(now, "America/New_York")
      	if err != nil {
      		t.Fatal(err)
      	}
      	if got.Date != "2026-03-08" || got.Weekday != "Sunday" {
      		t.Fatalf("today = %s %s", got.Date, got.Weekday)
      	}
      	if got.Yesterday.Date != "2026-03-07" || got.Tomorrow.Date != "2026-03-09" {
      		t.Fatalf("date arithmetic crossed DST incorrectly: yesterday=%+v tomorrow=%+v", got.Yesterday, got.Tomorrow)
      	}
      }
      
      func TestDayAtRejectsMissingOrNonIanaTimezone(t *testing.T) {
      	now := time.Date(2026, time.November, 18, 12, 0, 0, 0, time.UTC)
      	for _, timezone := range []string{"", "   ", "Local", "Not/A_Real_Zone"} {
      		t.Run(timezone, func(t *testing.T) {
      			if _, err := dayAt(now, timezone); err == nil {
      				t.Fatalf("dayAt accepted invalid timezone %q", timezone)
      			}
      		})
      	}
      }
      
      
      func TestToolserverHostAndOriginAllowlist(t *testing.T) {
      	t.Setenv("TOOLSERVER_ALLOWED_HOSTS", "")
      	t.Setenv("TOOLSERVER_ALLOWED_ORIGINS", "")
      
      	for _, host := range []string{"localhost", "localhost:8000", "127.0.0.1", "127.0.0.1:8000", "[::1]:8000"} {
      		if !allowedHost(host) {
      			t.Errorf("default loopback host %q was rejected", host)
      		}
      	}
      	if allowedHost("mcp.attacker.example") {
      		t.Error("non-loopback Host was accepted")
      	}
      	if allowedOrigin("https://attacker.example") {
      		t.Error("Origin was accepted without an explicit allowlist")
      	}
      
      	t.Setenv("TOOLSERVER_ALLOWED_HOSTS", "mcp.example.test")
      	t.Setenv("TOOLSERVER_ALLOWED_ORIGINS", "https://app.example.test")
      	if !allowedHost("localhost:8000") {
      		t.Error("custom Host allowlist removed the loopback health-check host")
      	}
      	if !allowedHost("mcp.example.test") || !allowedOrigin("https://app.example.test") {
      		t.Error("explicit Host and Origin allowlists were not honored")
      	}
      }
      
      func TestToolserverCORSPreflightAndActualRequest(t *testing.T) {
      	t.Setenv("TOOLSERVER_ALLOWED_HOSTS", "")
      	t.Setenv("TOOLSERVER_ALLOWED_ORIGINS", "https://app.example.test")
      
      	next := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
      		w.WriteHeader(http.StatusAccepted)
      	})
      	handler := requestSecurity(next)
      
      	preflight := httptest.NewRequest(http.MethodOptions, "http://localhost:8000/mcp", nil)
      	preflight.Host = "localhost:8000"
      	preflight.Header.Set("Origin", "https://app.example.test")
      	preflight.Header.Set("Access-Control-Request-Method", http.MethodPost)
      	preflight.Header.Set("Access-Control-Request-Headers", "content-type, authorization, mcp-protocol-version")
      	preflightResponse := httptest.NewRecorder()
      	handler.ServeHTTP(preflightResponse, preflight)
      	if preflightResponse.Code != http.StatusNoContent {
      		t.Fatalf("preflight status = %d, want 204: %s", preflightResponse.Code, preflightResponse.Body.String())
      	}
      	for name, want := range map[string]string{
      		"Access-Control-Allow-Origin": "https://app.example.test",
      		"Access-Control-Allow-Methods": "GET, POST, DELETE",
      		"Access-Control-Allow-Headers": "Accept, Authorization, Content-Type, Last-Event-ID, Mcp-Protocol-Version, Mcp-Session-Id",
      	} {
      		if got := preflightResponse.Header().Get(name); got != want {
      			t.Errorf("%s = %q, want %q", name, got, want)
      		}
      	}
      
      	actual := httptest.NewRequest(http.MethodPost, "http://localhost:8000/mcp", nil)
      	actual.Host = "localhost:8000"
      	actual.Header.Set("Origin", "https://app.example.test")
      	actualResponse := httptest.NewRecorder()
      	handler.ServeHTTP(actualResponse, actual)
      	if actualResponse.Code != http.StatusAccepted {
      		t.Fatalf("actual request status = %d, want 202", actualResponse.Code)
      	}
      	if got := actualResponse.Header().Get("Access-Control-Allow-Origin"); got != "https://app.example.test" {
      		t.Errorf("actual response ACAO = %q", got)
      	}
      	if got := actualResponse.Header().Get("Vary"); got != "Origin" {
      		t.Errorf("actual response Vary = %q, want Origin", got)
      	}
      }
      
      func TestToolserverCORSRejectsUnlistedOriginsMethodsAndHeaders(t *testing.T) {
      	t.Setenv("TOOLSERVER_ALLOWED_HOSTS", "")
      	t.Setenv("TOOLSERVER_ALLOWED_ORIGINS", "https://app.example.test")
      	handler := requestSecurity(http.HandlerFunc(func(w http.ResponseWriter, _ *http.Request) {
      		w.WriteHeader(http.StatusOK)
      	}))
      
      	tests := []struct {
      		name, origin, method, headers string
      	}{
      		{name: "unlisted origin", origin: "https://attacker.example", method: http.MethodPost},
      		{name: "unlisted method", origin: "https://app.example.test", method: http.MethodPut},
      		{name: "unlisted header", origin: "https://app.example.test", method: http.MethodPost, headers: "x-unapproved"},
      	}
      	for _, tt := range tests {
      		t.Run(tt.name, func(t *testing.T) {
      			r := httptest.NewRequest(http.MethodOptions, "http://localhost:8000/mcp", nil)
      			r.Host = "localhost:8000"
      			r.Header.Set("Origin", tt.origin)
      			r.Header.Set("Access-Control-Request-Method", tt.method)
      			r.Header.Set("Access-Control-Request-Headers", tt.headers)
      			w := httptest.NewRecorder()
      			handler.ServeHTTP(w, r)
      			if w.Code != http.StatusForbidden {
      				t.Fatalf("status = %d, want 403", w.Code)
      			}
      		})
      	}
      }
  smoke:
    rust:
      tests/toolserver_smoke.rs: |
        //! End-to-end MCP smoke test for native and upstream tools.
        //!
        //! Needs the local stack running (devo dev).
        //! Run with: cargo test --test toolserver_smoke -- --nocapture
        //!
        //! Grafana itself need not be running. The Grafana MCP provider is bundled in
        //! the toolserver container; day.get is a native in-process tool.
        
        use std::io::{Read, Write};
        use std::net::TcpStream;
        use std::thread;
        use std::time::Duration;
        
        const ADDR: &str = "127.0.0.1:8000";
        const HOST: &str = "127.0.0.1:8000";
        
        fn request(method: &str, path: &str, body: &str) -> Result<String, String> {
            let mut stream = TcpStream::connect(ADDR)
                .map_err(|e| format!("could not connect to {ADDR}: {e}"))?;
            stream.set_read_timeout(Some(Duration::from_secs(5))).map_err(|e| e.to_string())?;
            stream.set_write_timeout(Some(Duration::from_secs(5))).map_err(|e| e.to_string())?;
        
            let mut headers = format!("{method} {path} HTTP/1.0\r\nHost: {HOST}\r\nConnection: close\r\n");
            if method == "POST" {
                headers.push_str(&format!(
                    "Content-Type: application/json\r\nAccept: application/json, text/event-stream\r\nMcp-Protocol-Version: 2025-11-25\r\nContent-Length: {}\r\n",
                    body.as_bytes().len()
                ));
            }
            headers.push_str("\r\n");
        
            stream.write_all(headers.as_bytes())
                .and_then(|_| stream.write_all(body.as_bytes()))
                .map_err(|e| e.to_string())?;
        
            let mut response = Vec::new();
            stream.read_to_end(&mut response).map_err(|e| format!("reading HTTP response: {e}"))?;
            let response = String::from_utf8_lossy(&response);
            let (status_line, rest) = response.split_once("\r\n")
                .ok_or_else(|| format!("invalid HTTP response: {response}"))?;
            let status = status_line.split_whitespace().nth(1).unwrap_or("missing");
            if status != "200" {
                return Err(format!("HTTP {status}: {response}"));
            }
            let (_, response_body) = rest.split_once("\r\n\r\n")
                .ok_or_else(|| format!("HTTP response has no header terminator: {response}"))?;
            Ok(response_body.to_string())
        }
        
        fn wait_for_health() -> Result<(), String> {
            let mut last = String::new();
            for _ in 0..30 {
                match request("GET", "/healthz", "") {
                    Ok(_) => return Ok(()),
                    Err(error) => last = error,
                }
                thread::sleep(Duration::from_secs(1));
            }
            Err(format!("toolserver did not become healthy after 30s: {last}\nIs the stack up? Run devo dev."))
        }
        
        #[test]
        fn toolserver_exposes_native_and_grafana_tools_over_mcp() {
            wait_for_health().unwrap_or_else(|error| panic!("{error}"));
        
            let initialize = r#"{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"devo-smoke","version":"0.1.0"}}}"#;
            let response = request("POST", "/mcp", initialize)
                .unwrap_or_else(|error| panic!("MCP initialize failed: {error}"));
            assert!(response.contains("2025-11-25"), "initialize did not negotiate MCP protocol version: {response}");
        
            let list_tools = r#"{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}"#;
            let response = request("POST", "/mcp", list_tools)
                .unwrap_or_else(|error| panic!("tools/list failed: {error}"));
            assert!(response.contains("day.get"), "catalog omitted native day.get: {response}");
            assert!(response.contains("grafana."), "catalog omitted tools from the bundled Grafana MCP provider: {response}");
        
            let call_day = r#"{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"day.get","arguments":{"timezone":"America/New_York"}}}"#;
            let response = request("POST", "/mcp", call_day)
                .unwrap_or_else(|error| panic!("day.get failed: {error}"));
            for expected in ["America/New_York", "date", "weekday", "tomorrow", "yesterday"] {
                assert!(response.contains(expected), "day.get response omitted {expected:?}: {response}");
            }
            println!("ok: MCP initializes, lists native and Grafana tools, and invokes day.get in the caller timezone");
        }
