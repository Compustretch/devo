# Service registry.
#
# The first key is the services list: every known service with the state a NEW
# project starts in (true/false). Below it, each service has its own config
# block named after it. A project's real state lives in its devo.yaml and is
# changed with `devo add` / `devo remove`.
#
# Service block fields:
#   description          shown by `devo services`
#   params               tunable settings with defaults. A project overrides them
#                        with a block of the same name in devo.yaml.
#                        Reference them as "{{param}}" (quote the value in YAML).
#                        "{{project_name}}" is always available.
#   compose              copied verbatim into compose.yaml under this service
#   volumes              named volumes to declare at the top of compose.yaml
#   files                path (relative to project root) -> content, written when enabled
#   env                  NAME: value pairs added to .env when the service is enabled:
#                        the endpoints an app uses to reach the service
#   auth                 NAME: value pairs added to .auth when the service is enabled:
#                        the service's default credentials. Both files only gain
#                        names they do not already define, so edits survive.
#   datasource           a Grafana datasource this service provides (optional)
#   plugins              Grafana plugins that datasource needs installed (optional)
#   datasources_file     marks a service as a datasource consumer (e.g. Grafana):
#                        all enabled datasources are written to this path, and
#                        the service waits for providers that have a healthcheck
#   plugins_env          on a datasource consumer: the env var that receives the plugins
#                        of every enabled provider (GF_INSTALL_PLUGINS for Grafana)
#
# `name` and `services` are reserved and can't be used as service names.

services:
  clickhouse: false
  grafana: false
  loki: false
  tempo: false
  postgres: false
  redis: false
  rabbitmq: false
  ollaya: false

clickhouse:
  description: ClickHouse analytics database
  env:
    CLICKHOUSE_URL: http://127.0.0.1:8123
  auth:
    CLICKHOUSE_USER: "{{user}}"
    CLICKHOUSE_PASSWORD: "{{password}}"
  plugins: [grafana-clickhouse-datasource]
  params:
    version: "25.3"
    database: app
    user: app
    password: app
  compose:
    image: "clickhouse/clickhouse-server:{{version}}"
    ports: ["8123:8123", "9000:9000"]
    environment:
      CLICKHOUSE_DB: "{{database}}"
      CLICKHOUSE_USER: "{{user}}"
      CLICKHOUSE_PASSWORD: "{{password}}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./platform/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "{{user}}", "--password", "{{password}}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20
  volumes: [clickhouse_data]
  datasource:
    name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    editable: false
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      defaultDatabase: "{{database}}"
      defaultTable: events
      username: "{{user}}"
      tlsSkipVerify: true
    secureJsonData:
      password: "{{password}}"
  samples:
    - platform/clickhouse/init/001-events.sql
    - platform/grafana/dashboards/events.json
  # `devo add -m` pipes each forward migration in this directory (*.sql, except
  # *.down.sql and *.smoke.sql) to this command inside the running container.
  # It reads the container's own credentials, so it follows whatever user and
  # password the project is configured with.
  migrate:
    dir: platform/clickhouse/init
    exec:
      - sh
      - -c
      - 'clickhouse-client ${CLICKHOUSE_USER:+--user "$CLICKHOUSE_USER"} ${CLICKHOUSE_PASSWORD:+--password "$CLICKHOUSE_PASSWORD"} --multiquery'
  # In an adopted project the app owns its schema: no demo files, smoke test or
  # init mount (devo drops those), and no seeded database. The standard user and
  # password still apply, so the developer has credentials to harden later.
  adopted:
    params:
      database: default
  files:
    platform/clickhouse/init/001-events.sql: |
      CREATE TABLE IF NOT EXISTS {{database}}.events
      (
          event_time DateTime DEFAULT now(),
          event_type String,
          message String
      )
      ENGINE = MergeTree
      ORDER BY (event_time, event_type);

      INSERT INTO {{database}}.events (event_type, message)
      VALUES ('devo.init', 'Devo development environment is ready');
    platform/grafana/dashboards/events.json: |
      {
        "id": null,
        "uid": "devo-events",
        "title": "Devo Events",
        "tags": ["devo"],
        "timezone": "browser",
        "schemaVersion": 39,
        "version": 1,
        "refresh": "5s",
        "panels": [
          {
            "id": 1,
            "type": "timeseries",
            "title": "Events over time",
            "datasource": {"type": "grafana-clickhouse-datasource", "uid": "clickhouse"},
            "gridPos": {"h": 9, "w": 24, "x": 0, "y": 0},
            "targets": [
              {"refId": "A", "queryType": "sql", "rawSql": "SELECT toStartOfMinute(event_time) AS time, count() AS events FROM {{database}}.events GROUP BY time ORDER BY time"}
            ]
          }
        ]
      }
  smoke:
    rust:
      tests/clickhouse_smoke.rs: |
        //! Smoke test: write a log entry to ClickHouse and read it back.
        //!
        //! Needs the local stack running (`devo dev`).
        //! Run with: cargo test --test clickhouse_smoke -- --nocapture
        //!
        //! Generated by devo when the clickhouse service was enabled. Edit freely; devo
        //! won't overwrite it, and removes it if the service is removed.

        use std::io::{Read, Write};
        use std::net::TcpStream;
        use std::thread;
        use std::time::{Duration, SystemTime, UNIX_EPOCH};

        const ADDR: &str = "localhost:8123";
        const USER: &str = "{{user}}";
        const PASSWORD: &str = "{{password}}";
        const DATABASE: &str = "{{database}}";

        /// Minimal HTTP/1.0 client (std only), so this test needs no dependencies.
        fn http(
            addr: &str,
            method: &str,
            path: &str,
            content_type: &str,
            body: &str,
        ) -> Result<(u16, String), String> {
            let mut stream =
                TcpStream::connect(addr).map_err(|e| format!("could not connect to {addr}: {e}"))?;
            stream
                .set_read_timeout(Some(Duration::from_secs(10)))
                .map_err(|e| e.to_string())?;
            let request = format!(
                "{method} {path} HTTP/1.0\r\nHost: {addr}\r\nContent-Type: {content_type}\r\nContent-Length: {}\r\n\r\n{body}",
                body.len()
            );
            stream
                .write_all(request.as_bytes())
                .map_err(|e| e.to_string())?;
            let mut response = String::new();
            stream
                .read_to_string(&mut response)
                .map_err(|e| e.to_string())?;
            let status = response
                .split_whitespace()
                .nth(1)
                .and_then(|code| code.parse().ok())
                .unwrap_or(0);
            let body = response
                .split_once("\r\n\r\n")
                .map(|(_, b)| b.to_string())
                .unwrap_or_default();
            Ok((status, body))
        }

        /// Services take a few seconds to come up; retry for up to a minute.
        fn wait_until(what: &str, mut check: impl FnMut() -> Result<(), String>) {
            let mut last = String::new();
            for _ in 0..30 {
                match check() {
                    Ok(()) => return,
                    Err(e) => last = e,
                }
                thread::sleep(Duration::from_secs(2));
            }
            panic!("{what} not ready after 60s: {last}\nIs the stack up? Try `devo dev`.");
        }

        fn exec(sql: &str) -> String {
            let path = format!("/?user={USER}&password={PASSWORD}&database={DATABASE}");
            let (status, body) = http(ADDR, "POST", &path, "text/plain", sql)
                .unwrap_or_else(|e| panic!("request to ClickHouse failed: {e}"));
            assert_eq!(status, 200, "ClickHouse returned HTTP {status} for `{sql}`:\n{body}");
            body
        }

        #[test]
        fn writes_a_log_entry_to_clickhouse() {
            wait_until("ClickHouse", || match http(ADDR, "GET", "/ping", "text/plain", "") {
                Ok((200, _)) => Ok(()),
                Ok((status, body)) => Err(format!("HTTP {status}: {}", body.trim())),
                Err(e) => Err(e),
            });

            // Unique per run, so re-running never matches an old row.
            let millis = SystemTime::now().duration_since(UNIX_EPOCH).unwrap().as_millis();
            let message = format!("hello world {millis}");

            // event_time is filled in by the table's DEFAULT now().
            exec(&format!(
                "INSERT INTO events (event_type, message) VALUES ('smoke_test', '{message}')"
            ));

            let count = exec(&format!(
                "SELECT count() FROM events WHERE event_type = 'smoke_test' AND message = '{message}'"
            ));
            assert_eq!(count.trim(), "1", "expected one row for {message:?}, found {}", count.trim());
            println!("ok: wrote and read back {message:?} in {DATABASE}.events");
        }

postgres:
  description: PostgreSQL
  env:
    POSTGRES_HOST: 127.0.0.1
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "{{database}}"
  auth:
    POSTGRES_USER: "{{user}}"
    POSTGRES_PASSWORD: "{{password}}"
  params:
    version: "17"
    database: app
    user: app
    password: app
  compose:
    image: "postgres:{{version}}"
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: "{{database}}"
      POSTGRES_USER: "{{user}}"
      POSTGRES_PASSWORD: "{{password}}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./platform/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{user}} -d {{database}}"]
      interval: 5s
      timeout: 3s
      retries: 20
  volumes: [postgres_data]
  datasource:
    name: Postgres
    uid: postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: "{{user}}"
    editable: false
    jsonData:
      database: "{{database}}"
      sslmode: disable
    secureJsonData:
      password: "{{password}}"
  samples:
    - platform/postgres/init/001-init.sql
  files:
    platform/postgres/init/001-init.sql: |
      CREATE TABLE IF NOT EXISTS events (
          id         BIGSERIAL PRIMARY KEY,
          event_time TIMESTAMPTZ NOT NULL DEFAULT now(),
          event_type TEXT NOT NULL,
          message    TEXT NOT NULL
      );

      INSERT INTO events (event_type, message)
      VALUES ('devo.init', 'Devo development environment is ready');
  smoke:
    rust:
      tests/postgres_smoke.rs: |
        //! Smoke test: connect to PostgreSQL and complete the protocol handshake.
        //!
        //! This proves a Postgres server is up and accepting connections for the
        //! configured user and database. A real query needs a client library; add one
        //! (e.g. the `postgres` crate) if you want a write/read round trip.
        //!
        //! Needs the local stack running (`devo dev`).
        //! Run with: cargo test --test postgres_smoke -- --nocapture
        //!
        //! Generated by devo when the postgres service was enabled. Edit freely; devo
        //! won't overwrite it, and removes it if the service is removed.

        use std::io::{Read, Write};
        use std::net::TcpStream;
        use std::thread;
        use std::time::Duration;

        const ADDR: &str = "localhost:5432";
        const USER: &str = "{{user}}";
        const DATABASE: &str = "{{database}}";

        /// Connects, retrying for up to a minute while the service starts.
        fn connect() -> TcpStream {
            for _ in 0..30 {
                if let Ok(stream) = TcpStream::connect(ADDR) {
                    stream
                        .set_read_timeout(Some(Duration::from_secs(10)))
                        .unwrap();
                    return stream;
                }
                thread::sleep(Duration::from_secs(2));
            }
            panic!("could not connect to {ADDR} after 60s.\nIs the stack up? Try `devo dev`.");
        }

        #[test]
        fn postgres_accepts_a_connection() {
            let mut stream = connect();

            // StartupMessage: length, protocol 3.0, key/value pairs, trailing NUL.
            let mut msg: Vec<u8> = vec![0, 0, 0, 0];
            msg.extend_from_slice(&196608u32.to_be_bytes());
            for part in ["user", USER, "database", DATABASE] {
                msg.extend_from_slice(part.as_bytes());
                msg.push(0);
            }
            msg.push(0);
            let len = (msg.len() as u32).to_be_bytes();
            msg[..4].copy_from_slice(&len);
            stream.write_all(&msg).unwrap();

            // The server answers with an Authentication request ('R'), or an error ('E').
            let mut first = [0u8; 1];
            stream.read_exact(&mut first).expect("no reply from Postgres");
            assert_eq!(
                first[0], b'R',
                "expected an Authentication request ('R'), got {:?}",
                first[0] as char
            );
            println!("ok: Postgres at {ADDR} accepted a startup for {USER}@{DATABASE}");
        }

redis:
  description: Redis cache
  env:
    REDIS_URL: redis://127.0.0.1:6379
  params:
    version: "7"
  compose:
    image: "redis:{{version}}"
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  smoke:
    rust:
      tests/redis_smoke.rs: |
        //! Smoke test: write a key to Redis and read it back.
        //!
        //! Needs the local stack running (`devo dev`).
        //! Run with: cargo test --test redis_smoke -- --nocapture
        //!
        //! Generated by devo when the redis service was enabled. Edit freely; devo
        //! won't overwrite it, and removes it if the service is removed.

        use std::io::{Read, Write};
        use std::net::TcpStream;
        use std::thread;
        use std::time::{Duration, SystemTime, UNIX_EPOCH};

        const ADDR: &str = "localhost:6379";

        /// Connects, retrying for up to a minute while the service starts.
        fn connect() -> TcpStream {
            for _ in 0..30 {
                if let Ok(stream) = TcpStream::connect(ADDR) {
                    stream
                        .set_read_timeout(Some(Duration::from_secs(10)))
                        .unwrap();
                    return stream;
                }
                thread::sleep(Duration::from_secs(2));
            }
            panic!("could not connect to {ADDR} after 60s.\nIs the stack up? Try `devo dev`.");
        }

        /// Sends one command in the Redis wire protocol and returns the raw reply.
        fn command(stream: &mut TcpStream, args: &[&str]) -> String {
            let mut request = format!("*{}\r\n", args.len());
            for arg in args {
                request.push_str(&format!("${}\r\n{}\r\n", arg.len(), arg));
            }
            stream.write_all(request.as_bytes()).unwrap();
            let mut buf = [0u8; 1024];
            let n = stream.read(&mut buf).expect("no reply from Redis");
            String::from_utf8_lossy(&buf[..n]).into_owned()
        }

        #[test]
        fn writes_and_reads_a_key_in_redis() {
            let mut stream = connect();

            let millis = SystemTime::now().duration_since(UNIX_EPOCH).unwrap().as_millis();
            let key = format!("devo:smoke:{millis}");
            let value = "hello world";

            assert_eq!(command(&mut stream, &["SET", key.as_str(), value]), "+OK\r\n");
            assert_eq!(
                command(&mut stream, &["GET", key.as_str()]),
                format!("${}\r\n{}\r\n", value.len(), value)
            );
            command(&mut stream, &["DEL", key.as_str()]);
            println!("ok: wrote and read back {key} in Redis");
        }

grafana:
  description: Grafana dashboards
  env:
    GRAFANA_URL: http://127.0.0.1:3000
  auth:
    GRAFANA_USER: "{{admin_user}}"
    GRAFANA_PASSWORD: "{{admin_password}}"
  plugins_env: GF_INSTALL_PLUGINS
  params:
    version: "11.6.0"
    admin_user: admin
    admin_password: admin
  datasources_file: platform/grafana/provisioning/datasources/datasource.yaml
  compose:
    image: "grafana/grafana:{{version}}"
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: "{{admin_user}}"
      GF_SECURITY_ADMIN_PASSWORD: "{{admin_password}}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./platform/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./platform/grafana/dashboards:/var/lib/grafana/dashboards:ro
  files:
    platform/grafana/dashboards/.gitkeep: ""
    platform/grafana/provisioning/dashboards/dashboard.yaml: |
      apiVersion: 1
      providers:
        - name: Devo
          orgId: 1
          folder: Devo
          type: file
          disableDeletion: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards
  smoke:
    rust:
      tests/grafana_smoke.rs: |
        //! Smoke test: check that Grafana is up and its database is healthy.
        //!
        //! Needs the local stack running (`devo dev`).
        //! Run with: cargo test --test grafana_smoke -- --nocapture
        //!
        //! Generated by devo when the grafana service was enabled. Edit freely; devo
        //! won't overwrite it, and removes it if the service is removed.

        use std::io::{Read, Write};
        use std::net::TcpStream;
        use std::thread;
        use std::time::Duration;

        const ADDR: &str = "localhost:3000";

        /// Minimal HTTP/1.0 client (std only), so this test needs no dependencies.
        fn http(
            addr: &str,
            method: &str,
            path: &str,
            content_type: &str,
            body: &str,
        ) -> Result<(u16, String), String> {
            let mut stream =
                TcpStream::connect(addr).map_err(|e| format!("could not connect to {addr}: {e}"))?;
            stream
                .set_read_timeout(Some(Duration::from_secs(10)))
                .map_err(|e| e.to_string())?;
            let request = format!(
                "{method} {path} HTTP/1.0\r\nHost: {addr}\r\nContent-Type: {content_type}\r\nContent-Length: {}\r\n\r\n{body}",
                body.len()
            );
            stream
                .write_all(request.as_bytes())
                .map_err(|e| e.to_string())?;
            let mut response = String::new();
            stream
                .read_to_string(&mut response)
                .map_err(|e| e.to_string())?;
            let status = response
                .split_whitespace()
                .nth(1)
                .and_then(|code| code.parse().ok())
                .unwrap_or(0);
            let body = response
                .split_once("\r\n\r\n")
                .map(|(_, b)| b.to_string())
                .unwrap_or_default();
            Ok((status, body))
        }

        /// Services take a few seconds to come up; retry for up to a minute.
        fn wait_until(what: &str, mut check: impl FnMut() -> Result<(), String>) {
            let mut last = String::new();
            for _ in 0..30 {
                match check() {
                    Ok(()) => return,
                    Err(e) => last = e,
                }
                thread::sleep(Duration::from_secs(2));
            }
            panic!("{what} not ready after 60s: {last}\nIs the stack up? Try `devo dev`.");
        }

        #[test]
        fn grafana_is_healthy() {
            wait_until("Grafana", || match http(ADDR, "GET", "/api/health", "text/plain", "") {
                Ok((200, body)) if body.replace(' ', "").contains("\"database\":\"ok\"") => Ok(()),
                Ok((status, body)) => Err(format!("HTTP {status}: {}", body.trim())),
                Err(e) => Err(e),
            });
            println!("ok: Grafana at {ADDR} reports a healthy database");
        }

